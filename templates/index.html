<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Faculty Management Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --secondary: #1B3058;
            --background: #0F172A;
            --foreground: #E2E8F0;
            --muted: #64748B;
            --accent: #F59E0B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            line-height: 1.6;
        }

        .main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav {
            background-color: var(--secondary);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-logo p {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--foreground);
        }

        .nav-options {
            display: flex;
            gap: 1rem;
        }

        .nav-options button {
            background-color: transparent;
            border: none;
            color: var(--foreground);
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .nav-options button:hover {
            opacity: 1;
        }

        .info-box {
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 2rem;
            gap: 2rem;
        }

        .info-box-main {
            width: 60%;
            max-width: 800px;
        }

        .options-container {
            width: 35%;
            margin-top: 0;
            position: sticky;
            top: 2rem;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            background-color: rgba(27, 48, 88, 0.1);
            border-radius: 0.5rem;
            padding: 1rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--accent);
        }

        #role-select {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 2px solid var(--primary);
            border-radius: 0.5rem;
            background-color: var(--background);
            color: var(--foreground);
            margin-bottom: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #role-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.1);
        }

        #chat-container {
            height: 400px;
            border: 2px solid var(--primary);
            border-radius: 0.5rem;
            background-color: rgba(27, 48, 88, 0.1);
            padding: 1rem;
            margin-bottom: 1rem;
            overflow-y: auto;
        }

        #user-input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 2px solid var(--primary);
            border-radius: 0.5rem;
            background-color: var(--background);
            color: var(--foreground);
            margin-bottom: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #user-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.1);
        }

        #send-btn {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            background-color: var(--primary);
            color: var(--foreground);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #send-btn:hover {
            background-color: var(--primary-dark);
        }

        .options-container h2 {
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .options-container button {
            background-color: var(--primary);
            color: var(--foreground);
            border: none;
            padding: 0.5rem 1rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .options-container button:hover {
            background-color: var(--primary-dark);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 2px solid var(--primary);
            border-radius: 0.5rem;
            background-color: var(--background);
            color: var(--foreground);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.1);
        }

        .footer {
            background-color: var(--secondary);
            padding: 2rem 1.5rem;
            margin-top: 2rem;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-section {
            flex: 1;
            min-width: 200px;
            margin-bottom: 1.5rem;
        }

        .footer-section h3 {
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .footer-section p,
        .footer-section ul {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .footer-section ul {
            list-style-type: none;
        }

        .footer-section ul li {
            margin-bottom: 0.5rem;
        }

        .footer-section ul li a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-section ul li a:hover {
            color: var(--foreground);
        }

        .icon {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .icon i {
            color: var(--muted);
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .icon i:hover {
            color: var(--foreground);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .nav-options {
                display: none;
            }

            .footer-section {
                flex: 0 0 100%;
            }

            .info-box {
                flex-direction: column;
            }

            .info-box-main,
            .options-container {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="nav">
            <div class="nav-content">
                <div class="nav-logo">
                    <p>JIT-Borawan</p>
                </div>
                <div class="nav-options">
                    <button class="nav-btn">Home</button>
                    <button class="nav-btn">About Us</button>
                    <button class="nav-btn">Courses</button>
                    <button class="nav-btn">Admissions</button>
                    <button class="nav-btn">Contact Us</button>
                </div>
            </div>
        </div>
        
        <h1 style="margin-top: 3rem;">Student Faculty Management Chatbot</h1>

        <div class="info-box">
            <div class="info-box-main">
                <select id="role-select">
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                </select>
            
                <div id="chat-container"></div>
                <input type="text" id="user-input" placeholder="Type your message here...">
                <button id="send-btn">Send</button>
            </div>

            <div class="options-container">
                <div id="faculty-options" class="hidden">
                    <h2>Faculty Options</h2>
                    <button id="add-assignment-btn">Add Assignment</button>
                    <button id="update-attendance-btn">Update Attendance</button>
                    <button id="add-student-btn">Add Student</button>
                    <button id="remove-student-btn">Remove Student</button>
                    <button id="add-notice-btn">Add Notice</button>
                    
                    <div id="assignment-form" class="hidden">
                        <div class="form-group">
                            <select id="assignment-subject">
                                <option value="Internet and Web Technology">Internet and Web Technology</option>
                                <option value="Theory of Computation">Theory of Computation</option>
                                <option value="Cybersecurity">Cybersecurity</option>
                                <option value="DBMS">DBMS</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <input type="date" id="assignment-deadline" placeholder="Deadline">
                        </div>
                        <div class="form-group">
                            <textarea id="assignment-question" placeholder="Question"></textarea>
                        </div>
                        <div class="form-group">
                            <input type="text" id="assignment-professor" placeholder="Professor">
                        </div>
                        <button id="submit-assignment-btn">Submit Assignment</button>
                    </div>
                    
                    <div id="attendance-form" class="hidden">
                        <div class="form-group">
                            <select id="student-id"></select>
                        </div>
                        <div class="form-group">
                            <select id="attendance-subject">
                                <option value="iwt_attendance">Internet and Web Technology</option>
                                <option value="toc_attendance">Theory of Computation</option>
                                <option value="cybersecurity_attendance">Cybersecurity</option>
                                <option value="dbms_attendance">DBMS</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <input type="number" id="attendance-value" min="0" max="100" placeholder="Attendance (0-100)">
                        </div>
                        <button id="submit-attendance-btn">Submit Attendance</button>
                    </div>
                    
                    <div id="add-student-form" class="hidden">
                        <div class="form-group">
                            <input type="text" id="new-student-name" placeholder="Student Name">
                        </div>
                        <button id="confirm-add-student-btn">Add Student</button>
                    </div>

                    <div id="remove-student-form" class="hidden">
                        <div class="form-group">
                            <select id="remove-student-select"></select>
                        </div>
                        <button id="confirm-remove-student-btn">Remove Student</button>
                    </div>

                    <div id="add-notice-form" class="hidden">
                        <div class="form-group">
                            <select id="notice-subject">
                                <option value="Internet and Web Technology">Internet and Web Technology</option>
                                <option value="Theory of Computation">Theory of Computation</option>
                                <option value="Cybersecurity">Cybersecurity</option>
                                <option value="DBMS">DBMS</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <input type="text" id="notice-professor" placeholder="Professor Name">
                        </div>
                        <div class="form-group">
                            <textarea id="notice-text" placeholder="Notice Content"></textarea>
                        </div>
                        <button id="confirm-add-notice-btn">Add Notice</button>
                    </div>
                </div>
            
                <div id="student-options" class="hidden">
                    <h2>Student Options</h2>
                    <div class="form-group">
                        <select id="subject-filter">
                            <option value="">Select Subject</option>
                            <option value="Internet and Web Technology">Internet and Web Technology</option>
                            <option value="Theory of Computation">Theory of Computation</option>
                            <option value="Cybersecurity">Cybersecurity</option>
                            <option value="DBMS">DBMS</option>
                        </select>
                    </div>
                    <button id="check-assignments-btn">Check Assignments</button>
                    <button id="get-notices-btn">Get Notices</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>JIT-Borawan</h3>
                    <p>JAWAHARLAL NEHRU CHARITABLE EDUCATIONAL TRUST, BORAWAN was founded in 1996...</p>
                    <div class="icon">
                        <i class="fa-brands fa-linkedin"></i>
                        <i class="fa-brands fa-x-twitter"></i>
                        <i class="fa-brands fa-discord"></i>
                        <i class="fa-brands fa-github"></i>
                    </div>
                </div>
                <div class="footer-section">
                    <h3>Contact Us</h3>
                    <ul>
                        <li><i class="fa-solid fa-phone"></i> +91 7285-277-812</li>
                        <li><i class="fa-solid fa-envelope"></i> principal@jitechno.com</li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Faculty</h3>
                    <ul>
                        <li><a href="#">Faculty Directory</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Library</h3>
                    <ul>
                        <li><a href="#">Library Resources</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const roleSelect = document.getElementById('role-select');
        const facultyOptions = document.getElementById('faculty-options');
        const studentOptions = document.getElementById('student-options');
        const addAssignmentBtn = document.getElementById('add-assignment-btn');
        const updateAttendanceBtn = document.getElementById('update-attendance-btn');
        const assignmentForm = document.getElementById('assignment-form');
        const attendanceForm = document.getElementById('attendance-form');
        const submitAssignmentBtn = document.getElementById('submit-assignment-btn');
        const submitAttendanceBtn = document.getElementById('submit-attendance-btn');
        const checkAssignmentsBtn = document.getElementById('check-assignments-btn');
        const assignmentProfessorInput = document.getElementById('assignment-professor');
        
        const addStudentBtn = document.getElementById('add-student-btn');
        const removeStudentBtn = document.getElementById('remove-student-btn');
        const addNoticeBtn = document.getElementById('add-notice-btn');
        const subjectFilter = document.getElementById('subject-filter');

        function appendMessage(sender, message) {
            const messageElement = document.createElement('p');
            messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        async function sendMessage() {
            const message = userInput.value.trim();
            const role = roleSelect.value;
        
            if (message) {
                appendMessage('You', message);
                userInput.value = '';
        
                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ role, message }),
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    appendMessage('Chatbot', data.response);
                } catch (error) {
                    console.error('Error:', error);
                    appendMessage('Chatbot', 'Sorry, an error occurred while processing.');
                }
            }
        }
        function closeAllForms() {
            const forms = [
                'assignment-form',
                'attendance-form',
                'add-student-form',
                'remove-student-form',
                'add-notice-form'
            ];
            forms.forEach(formId => {
                document.getElementById(formId).classList.add('hidden');
            });
        }
        
        async function fetchStudents() {
            try {
                const response = await fetch('/get_students');
                const data = await response.json();
                if (data.error) {
                    console.error('Error fetching students:', data.error);
                    return;
                }
                const students = data.students;
                populateStudentDropdown('student-id', students);
                populateStudentDropdown('remove-student-select', students);
            } catch (error) {
                console.error('Error fetching students:', error);
            }
        }
        
        function populateStudentDropdown(dropdownId, students) {
            const dropdown = document.getElementById(dropdownId);
            dropdown.innerHTML = students.map(student => `<option value="${student.id}">${student.name}</option>`).join('');
        }
        
        async function addAssignment() {
            const subject = document.getElementById('assignment-subject').value;
            const deadline = document.getElementById('assignment-deadline').value;
            const question = document.getElementById('assignment-question').value;
            const professor = assignmentProfessorInput.value;
        
            try {
                const response = await fetch('/add_assignment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject, deadline, question, professor }),
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                appendMessage('System', data.response);
            } catch (error) {
                console.error('Error:', error);
                appendMessage('System', 'Error adding assignment.');
            }
        }
        
        async function updateAttendance() {
            const studentId = document.getElementById('student-id').value;
            const subject = document.getElementById('attendance-subject').value;
            const attendance = document.getElementById('attendance-value').value;
        
            try {
                const response = await fetch('/update_attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: studentId, subject, attendance }),
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                appendMessage('System', data.response);
            } catch (error) {
                console.error('Error:', error);
                appendMessage('System', 'Error updating attendance.');
            }
        }
        
        async function addStudent() {
            const studentName = document.getElementById('new-student-name').value;
            try {
                const response = await fetch('/add_student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: studentName }),
                });
                const data = await response.json();
                appendMessage('System', data.response);
                fetchStudents();
            } catch (error) {
                console.error('Error:', error);
                appendMessage('System', 'Error adding student');
            }
        }
        
        async function removeStudent() {
            const studentId = document.getElementById('remove-student-select').value;
            try {
                const response = await fetch(`/remove_student/${studentId}`, { method: 'DELETE' });
                const data = await response.json();
                appendMessage('System', data.response);
                fetchStudents();
            } catch (error) {
                console.error('Error:', error);
                appendMessage('System', 'Error removing student');
            }
        }
        
        async function addNotice() {
            const notice = {
                subject: document.getElementById('notice-subject').value,
                professor: document.getElementById('notice-professor').value,
                announcement: document.getElementById('notice-text').value,
                date: new Date().toISOString().split('T')[0],
            };
            try {
                const response = await fetch('/add_notice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(notice),
                });
                const data = await response.json();
                appendMessage('System', data.response);
            } catch (error) {
                console.error('Error:', error);
                appendMessage('System', 'Error adding notice');
            }
        }
        async function getNotices() {
            const subject = subjectFilter.value;
            try {
                const endpoint = subject ? `/get_notices_by_subject/${subject}` : '/get_notices';
                const response = await fetch(endpoint);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                let message = data.notices.length ? 'Notices:\n' : 'No notices found.\n';
                data.notices.forEach(n => {
                    message += `Subject: ${n.subject}, Date: ${n.date}, Professor: ${n.professor}\nAnnouncement: ${n.announcement}\n\n`;
                });
                appendMessage('System', message);
            } catch (error) {
                console.error('Error:', error);
                appendMessage('System', `Error fetching notices: ${error.message}`);
            }
        }
        
        async function checkAssignments() {
            const subject = subjectFilter.value;
            try {
                const endpoint = subject ? `/get_assignments_by_subject/${subject}` : '/get_assignments';
                const response = await fetch(endpoint);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                let message = data.assignments.length ? 'Assignments:\n' : 'No assignments found.\n';
                data.assignments.forEach(a => {
                    message += `Subject: ${a.subject}, Deadline: ${a.deadline}, Question: ${a.question}, Professor: ${a.professor}\n`;
                });
                appendMessage('System', message);
            } catch (error) {
                console.error('Error:', error);
                appendMessage('System', 'Error fetching assignments.');
            }
        }
        
        document.getElementById('confirm-add-student-btn').addEventListener('click', addStudent);
        document.getElementById('confirm-remove-student-btn').addEventListener('click', removeStudent);
        document.getElementById('confirm-add-notice-btn').addEventListener('click', addNotice);
        document.getElementById('get-notices-btn').addEventListener('click', getNotices);

        subjectFilter.addEventListener('change', checkAssignments);
        checkAssignmentsBtn.addEventListener('click', checkAssignments);
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        roleSelect.addEventListener('change', () => {
            facultyOptions.classList.toggle('hidden', roleSelect.value !== 'faculty');
            studentOptions.classList.toggle('hidden', roleSelect.value !== 'student');
        });
        addAssignmentBtn.addEventListener('click', () => {
            closeAllForms();
            assignmentForm.classList.toggle('hidden');
        });
        
        updateAttendanceBtn.addEventListener('click', () => {
            closeAllForms();
            attendanceForm.classList.toggle('hidden');
        });
        
        addStudentBtn.addEventListener('click', () => {
            closeAllForms();
            document.getElementById('add-student-form').classList.toggle('hidden');
        });
        
        removeStudentBtn.addEventListener('click', () => {
            closeAllForms();
            document.getElementById('remove-student-form').classList.toggle('hidden');
        });
        
        addNoticeBtn.addEventListener('click', () => {
            closeAllForms();
            document.getElementById('add-notice-form').classList.toggle('hidden');
        });
        
        submitAssignmentBtn.addEventListener('click', addAssignment);
        submitAttendanceBtn.addEventListener('click', updateAttendance);
        
        // Fetch students on page load
        document.addEventListener('DOMContentLoaded', fetchStudents);

        // Initialize the correct options panel based on the default role
        roleSelect.dispatchEvent(new Event('change'));
    </script>
</body>
</html>
